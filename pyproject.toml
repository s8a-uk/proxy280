[project]
name = "proxy280"
version = "0.3.0"
description = "280blocker.net proxy server for local network"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
proxy280 = "proxy280.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxy280"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
