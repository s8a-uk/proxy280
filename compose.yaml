services:
  proxy280:
    build:
      context: .
      target: runtime
    image: proxy280:latest
    container_name: proxy280
    ports:
      - "28000:28000"
    environment:
      PROXY280_TIMEZONE: Asia/Tokyo
    volumes:
      # 編集は再起動なしで /allowlist に反映される
      - type: bind
        source: ./allowlist.txt
        target: /config/allowlist.txt
        read_only: true
        bind:
          # ファイルが無いときにディレクトリを作らせない (make up が example から作る)
          create_host_path: false
    restart: unless-stopped
    # 権限は最小にする (ファイルを書かないのでルートファイルシステムも読み取り専用)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    image: proxy280:dev
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    # 権限は最小にし、ネットワークは使わせない (テストは loopback だけを使う)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - .:/app
