# 固定している版の更新を毎週 PR で提案する
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開から 7 日待って取り込む (乗っ取られたリリースはたいていそれまでに見つかる)
    cooldown:
      default-days: 7
  # Dockerfile の uv と Python のイメージ
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Python はパッチ版だけ上げる (requires-python が 3.15 を求めるため)。3.16 などへは手で上げる。
      # これでアルファ版・ベータ版のイメージも来なくなる
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
