name: CI

# PR はマージ前にここで検査する (main のルールセットが "all checks passed" と、PR が main に追従していることを
# 求める)。検査したものがそのままマージされるので、main への push では検査し直さない。
# workflow_dispatch で任意のブランチを検査できる
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: proxy280:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # compose.yaml と同じ権限 (読み取り専用・ケーパビリティなし) で起動できることを確かめる
      - name: Smoke test
        run: |
          docker run -d --name proxy280 -p 28000:28000 \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/allowlist.example.txt:/config/allowlist.txt:ro" proxy280:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:28000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:28000/healthz
          curl -fsS http://127.0.0.1:28000/allowlist
      - name: Show logs
        if: failure()
        run: docker logs proxy280

  # main のルールセットが求める唯一のチェック: 上のジョブがすべて通ったこと
  all-checks-passed:
    name: all checks passed
    if: always()
    needs: [test, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
